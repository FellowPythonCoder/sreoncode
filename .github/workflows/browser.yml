name: Sreon Browser

# One workflow that freezes the app and produces the double-click files:
#   macOS    Sreon.dmg (styled drag-to-Applications window) + Sreon.pkg
#   Windows  SreonSetup.exe (branded NSIS installer)
#   Linux    Sreon.AppImage + sreon_<version>_amd64.deb
# Every artifact is mounted / silent-installed / unpacked in CI before it is uploaded.

on:
  push:
    paths:
      - "Browser/**"
      - "If-it-says-unverified.txt"
      - ".github/workflows/browser.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the installers as a GitHub release (tag sreon-v<version>)"
        type: boolean
        default: false
      installer_app:
        description: "Also freeze the custom Qt installer GUI"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: sreon-build-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  # ------------------------------------------------------------------ preflight
  test:
    name: Unit tests, artwork and installer syntax
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            Browser/requirements.txt
            Browser/tools/requirements-design.txt
      - run: python -m pip install -U pip
      - run: python -m pip install pytest cryptography -r Browser/tools/requirements-design.txt
      - name: pytest
        run: PYTHONPATH=Browser python -m pytest Browser/tests -q
      - name: Artwork matches its generator
        run: |
          python Browser/tools/make_dmg_background.py
          python Browser/tools/make_dmg_background.py --nsis-assets
          # Byte-for-byte comparison would be brittle across FreeType builds, so the
          # committed art only has to be the same picture: same file, same size.
          fail=0
          for f in Browser/assets/dmg-background.png Browser/assets/dmg-background@2x.png \
                   Browser/installer/nsis/header.bmp Browser/installer/nsis/welcome.bmp; do
            now="$(stat -c%s "$f")"
            was="$(git cat-file -s "HEAD:$f" 2>/dev/null || echo 0)"
            if [ "$was" = "0" ]; then echo "::error::$f is not committed"; fail=1; continue; fi
            delta=$(( (now - was) * 100 / was ))
            if [ "${delta#-}" -gt 1 ]; then
              echo "::error::$f differs from the committed art by ${delta}% - run tools/make_dmg_background.py and commit the result"
              fail=1
            else
              echo "$f current ($now bytes, committed $was)"
            fi
          done
          exit $fail

      - name: NSIS script compiles (dummy payload, Linux makensis)
        run: |
          # Any failure is echoed as an annotation: `gh run view --log` is not always
          # reachable, but annotations come back from the API, so a red X stays readable.
          run_step () {
            local name="$1"; shift
            if ! "$@" > "/tmp/${name}.log" 2>&1; then
              # The raw log stream is not always reachable, so the annotation has to carry
              # the answer: every error-ish line, then the tail. Truncating to one short tail
              # is how a real failure hides behind "Process completed with exit code 1".
              local keys tail
              keys="$(grep -aiE '(^|[^a-z])(error|failed|traceback|exception|abort|no such|cannot|not found|denied)[^a-z]' "/tmp/${name}.log" | tail -30 | cut -c1-300 | tr '\n' '|' | tr '\r' ' ' | tr '%' '/')"
              tail="$(tail -c 6000 "/tmp/${name}.log" | tr '\n' '|' | tr '\r' ' ' | tr '%' '/')"
              [ -n "$keys" ] && echo "::error::${name} - error lines: ${keys:0:6000}"
              echo "::error::${name} - tail: ${tail:0:6000}"
              tail -100 "/tmp/${name}.log" || true
              exit 1
            fi
            cat "/tmp/${name}.log"
          }
          sudo apt-get update
          sudo apt-get install -y nsis
          mkdir -p Browser/dist/Sreon
          printf 'MZ dummy payload for a syntax check' > Browser/dist/Sreon/Sreon.exe
          # Same defines tools/build.py passes on Windows, so a script that compiles here
          # compiles there. SOURCE_GLOB/HEADER_BMP/WELCOME_BMP exist because NSIS resolves
          # "File" through its own path search, which is where a wrong separator bites.
          nsisdir="$GITHUB_WORKSPACE/Browser/installer/nsis"
          run_step makensis makensis -DVERSION=0.0.0 -DOUTFILE="$RUNNER_TEMP/dummy-setup.exe" \
            -DSOURCE_DIR="$GITHUB_WORKSPACE/Browser/dist/Sreon" \
            -DSOURCE_GLOB="$GITHUB_WORKSPACE/Browser/dist/Sreon/*.*" \
            -DICON="$GITHUB_WORKSPACE/Browser/assets/icon.ico" \
            -DHEADER_BMP="$nsisdir/header.bmp" \
            -DWELCOME_BMP="$nsisdir/welcome.bmp" \
            -DGUIDE="$GITHUB_WORKSPACE/If-it-says-unverified.txt" \
            Browser/installer/nsis/Sreon.nsi
          ls -lh "$RUNNER_TEMP/dummy-setup.exe"
      - name: Search engine compiles
        run: |
          cd Browser/search
          cargo check --release

  # -------------------------------------------------------------------- builders
  build:
    name: ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-14
            pack: macos
          - name: Windows
            os: windows-latest
            pack: windows
          - name: Linux
            os: ubuntu-22.04
            pack: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Browser/requirements.txt
      - name: Version and target label
        shell: bash
        run: |
          {
            echo "SREON_VERSION=$(tr -d '[:space:]' < Browser/VERSION)"
            if [ "${{ matrix.pack }}" = "macos" ]; then echo "SREON_PLATFORMS=Apple silicon"; else echo "SREON_PLATFORMS="; fi
          } >> "$GITHUB_ENV"
      - name: Linux build and runtime libraries
        if: matrix.pack == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libnss3 libasound2 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libatk1.0-0 libatk-bridge2.0-0 libdrm2 libgbm1 libcups2 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 \
            libfontconfig1 squashfs-tools libfuse2 dpkg-dev fakeroot
          mkdir -p Browser/tools/linux
          curl -fL -o Browser/tools/linux/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x Browser/tools/linux/appimagetool
      - name: NSIS for the Windows installer
        if: matrix.pack == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Notify([string]$what, $detail) {
            $text = ($detail | Out-String) -replace "`r|`n", ' ' -replace '%', '/'
            if ($text.Length -gt 1100) { $text = $text.Substring($text.Length - 1100) }
            Write-Host "::error::$what failed: $text"
            throw "$what failed"
          }
          $out = choco install nsis -y --no-progress 2>&1
          if ($LASTEXITCODE -ne 0) { Notify "choco install nsis" $out }
          # choco deploys NSIS under Program Files (x86) and shims makensis into its own bin
          # directory; which one ends up on PATH depends on the image, so try them in order.
          $candidates = @((Get-Command makensis.exe -ErrorAction SilentlyContinue).Source,
                          'C:\Program Files (x86)\NSIS\makensis.exe',
                          'C:\Program Files\NSIS\makensis.exe',
                          'C:\ProgramData\chocolatey\bin\makensis.exe')
          $exe = $null
          foreach ($candidate in $candidates) {
            if ($candidate -and (Test-Path -LiteralPath $candidate)) { $exe = (Get-Item -LiteralPath $candidate).FullName; break }
          }
          if (-not $exe) {
            $found = Get-ChildItem -Path 'C:\Program Files (x86)\NSIS' -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $exe = $found.FullName }
          }
          if (-not $exe) { Notify "locate makensis" "no makensis.exe among: $($candidates -join ', ')" }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $exe)
          $version = & $exe /VERSION
          if ($LASTEXITCODE -ne 0) { Notify "makensis /VERSION" "exit $LASTEXITCODE" }
          "makensis $version at $exe"

      - name: Install Python dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r Browser/requirements.txt
          python -m pip install -r Browser/tools/requirements-design.txt
      - name: Regenerate installer artwork
        if: matrix.pack == 'macos'
        run: python Browser/tools/make_dmg_background.py
      - name: Freeze Sreon and build the installers
        shell: bash
        run: |
          # Any failure is echoed as an annotation: `gh run view --log` is not always
          # reachable, but annotations come back from the API, so a red X stays readable.
          run_step () {
            local name="$1"; shift
            if ! "$@" > "/tmp/${name}.log" 2>&1; then
              # The raw log stream is not always reachable, so the annotation has to carry
              # the answer: every error-ish line, then the tail. Truncating to one short tail
              # is how a real failure hides behind "Process completed with exit code 1".
              local keys tail
              keys="$(grep -aiE '(^|[^a-z])(error|failed|traceback|exception|abort|no such|cannot|not found|denied)[^a-z]' "/tmp/${name}.log" | tail -30 | cut -c1-300 | tr '\n' '|' | tr '\r' ' ' | tr '%' '/')"
              tail="$(tail -c 6000 "/tmp/${name}.log" | tr '\n' '|' | tr '\r' ' ' | tr '%' '/')"
              [ -n "$keys" ] && echo "::error::${name} - error lines: ${keys:0:6000}"
              echo "::error::${name} - tail: ${tail:0:6000}"
              tail -100 "/tmp/${name}.log" || true
              exit 1
            fi
            cat "/tmp/${name}.log"
          }
          args=""
          if [ "${{ inputs.installer_app }}" = "true" ]; then args="$args --installer-app"; fi
          run_step build python -u Browser/tools/build.py $args
      - name: macOS - verify the image opens, launches, and is styled
        if: matrix.pack == 'macos'
        run: |
          # Any failure is echoed as an annotation: `gh run view --log` is not always
          # reachable, but annotations come back from the API, so a red X stays readable.
          run_step () {
            local name="$1"; shift
            if ! "$@" > "/tmp/${name}.log" 2>&1; then
              # The raw log stream is not always reachable, so the annotation has to carry
              # the answer: every error-ish line, then the tail. Truncating to one short tail
              # is how a real failure hides behind "Process completed with exit code 1".
              local keys tail
              keys="$(grep -aiE '(^|[^a-z])(error|failed|traceback|exception|abort|no such|cannot|not found|denied)[^a-z]' "/tmp/${name}.log" | tail -30 | cut -c1-300 | tr '\n' '|' | tr '\r' ' ' | tr '%' '/')"
              tail="$(tail -c 6000 "/tmp/${name}.log" | tr '\n' '|' | tr '\r' ' ' | tr '%' '/')"
              [ -n "$keys" ] && echo "::error::${name} - error lines: ${keys:0:6000}"
              echo "::error::${name} - tail: ${tail:0:6000}"
              tail -100 "/tmp/${name}.log" || true
              exit 1
            fi
            cat "/tmp/${name}.log"
          }
          # ds_store is what lets check_dmg.py read the Finder layout records; the styled
          # image is worthless to us if we cannot prove those records were written.
          run_step dsstore python -m pip install ds_store
          run_step macverify bash Browser/tools/ci-verify-macos.sh Browser/dist

      - name: Windows - silent install, check the result, uninstall
        if: matrix.pack == 'windows'
        # bash, like every other step: this step is written in PowerShell and PowerShell only
        # reported "exit code 1" no matter what was thrown, which cost several build cycles to
        # chase. bash plus run_step puts the real output in an annotation.
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1        # otherwise git-bash rewrites the /S switch into a path
        run: |
          run_step () {
            local name="$1"; shift
            if ! "$@" > "/tmp/${name}.log" 2>&1; then
              local keys tail
              keys="$(grep -aiE '(^|[^a-z])(error|failed|traceback|exception|abort|no such|cannot|not found|denied)[^a-z]' "/tmp/${name}.log" | tail -30 | cut -c1-300 | tr '\n' '|' | tr '\r' ' ' | tr '%' '/')"
              tail="$(tail -c 6000 "/tmp/${name}.log" | tr '\n' '|' | tr '\r' ' ' | tr '%' '/')"
              [ -n "$keys" ] && echo "::error::${name} - error lines: ${keys:0:6000}"
              echo "::error::${name} - tail: ${tail:0:6000}"
              tail -100 "/tmp/${name}.log" || true
              exit 1
            fi
            cat "/tmp/${name}.log"
          }
          set -uo pipefail
          installer=Browser/dist/SreonSetup.exe
          target="$RUNNER_TEMP/sreon-test"
          ls -l Browser/dist
          if [ ! -f "$installer" ]; then
            echo "::error::SreonSetup.exe is missing even though the build step reported it"
            tail -25 Browser/freeze.log 2>/dev/null || true
            exit 1
          fi
          rm -rf "$target"; mkdir -p "$target"
          # NSIS: /S for silent, and /D=<dir> must be the last argument, unquoted.
          "$installer" /S "/D=$target"; code=$?
          echo "installer exit code: $code"
          if [ "$code" -ne 0 ]; then
            echo "::error::the installer failed to run silently (exit $code)"
            ls -lR "$target" | head -30
            exit 1
          fi
          # An elevated NSIS installer hands off to a second process and the stub exits 0 right
          # away, so "it returned" means nothing: wait for the files to actually land, and accept
          # the default location too in case /D did not survive the handoff.
          default_dir="/c/Program Files/Sreon"
          exe=""
          for _ in $(seq 1 40); do
            exe="$(find "$target" -name Sreon.exe -print -quit 2>/dev/null || true)"
            [ -n "$exe" ] && break
            if [ -f "$default_dir/Sreon.exe" ]; then
              echo "::warning::the installer used $default_dir instead of /D=$target"
              target="$default_dir"
              exe="$default_dir/Sreon.exe"
              break
            fi
            sleep 5
          done
          if [ -z "$exe" ]; then
            echo "::error::no Sreon.exe under $target after 200s of waiting"
            ls -l "$target" 2>/dev/null | head -20
            echo "Program Files:"; ls -l '/c/Program Files' 2>/dev/null | grep -i sreon || echo "  no Sreon folder there either"
            exit 1
          fi
          here="$(dirname "$exe")"
          echo "launcher: $exe"
          # A frozen app is only complete with _internal beside the exe: QtWebEngine, the
          # assets folder, the search engine and the guide all live in there.
          for needed in _internal If-it-says-unverified.txt uninstall.exe; do
            if [ ! -e "$here/$needed" ] && [ -z "$(find "$target" -name "$needed" -print -quit)" ]; then
              echo "::error::$needed is not anywhere in the install"
              exit 1
            fi
          done
          bytes="$(du -sb "$target" | cut -f1)"
          mb=$(( bytes / 1000000 ))
          echo "installed $mb MB under $target"
          if [ "$mb" -lt 150 ]; then
            echo "::error::the install is only $mb MB - a real Sreon is 300 MB plus"
            exit 1
          fi
          ls -l "$here" | head -12
          "$here/Sreon.exe" --version > /tmp/sreon-version.log 2>&1 &
          sleep 12
          if pgrep -f 'Sreon.exe' > /dev/null; then
            echo "the installed binary starts (still running after 12s, which is a browser doing its job)"
            taskkill //F //IM Sreon.exe > /dev/null 2>&1 || true
          else
            echo "installed binary exited quickly - informational, headless CI has no desktop session"
            tail -8 /tmp/sreon-version.log 2>/dev/null || true
          fi
          # Start Menu and Add/Remove Programs are warnings: the runner's scope and the 32/64-bit
          # registry views vary, and a missing shortcut must not fail an installer that works.
          ls "$PROGRAMDATA/Microsoft/Windows/Start Menu/Programs/Sreon" 2>/dev/null \
            || echo "::warning::no Start Menu folder for Sreon"
          if reg query 'HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall\Sreon' > /tmp/arp.log 2>&1; then
            grep -iE 'DisplayName|DisplayVersion|Publisher|InstallLocation' /tmp/arp.log || cat /tmp/arp.log
          else
            echo "::warning::no 64-bit Add/Remove Programs entry; checking WOW6432Node"
            reg query 'HKLM\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Sreon' 2>&1 | head -8
          fi
          # The uninstaller copies itself to a temp folder and returns at once, so wait it out.
          "$here/uninstall.exe" /S
          sleep 8
          if [ -f "$exe" ]; then
            echo "::warning::uninstaller left Sreon.exe behind"
          else
            echo "uninstalled cleanly"
          fi
          if reg query 'HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall\Sreon' > /dev/null 2>&1; then
            echo "::warning::the Add/Remove Programs entry survived the uninstall"
          fi
          echo "windows installer checked: installs, lays down a complete tree, uninstalls"

      - name: Linux - check the AppImage and the deb
        if: matrix.pack == 'linux'
        run: |
          # Any failure is echoed as an annotation: `gh run view --log` is not always
          # reachable, but annotations come back from the API, so a red X stays readable.
          run_step () {
            local name="$1"; shift
            if ! "$@" > "/tmp/${name}.log" 2>&1; then
              # The raw log stream is not always reachable, so the annotation has to carry
              # the answer: every error-ish line, then the tail. Truncating to one short tail
              # is how a real failure hides behind "Process completed with exit code 1".
              local keys tail
              keys="$(grep -aiE '(^|[^a-z])(error|failed|traceback|exception|abort|no such|cannot|not found|denied)[^a-z]' "/tmp/${name}.log" | tail -30 | cut -c1-300 | tr '\n' '|' | tr '\r' ' ' | tr '%' '/')"
              tail="$(tail -c 6000 "/tmp/${name}.log" | tr '\n' '|' | tr '\r' ' ' | tr '%' '/')"
              [ -n "$keys" ] && echo "::error::${name} - error lines: ${keys:0:6000}"
              echo "::error::${name} - tail: ${tail:0:6000}"
              tail -100 "/tmp/${name}.log" || true
              exit 1
            fi
            cat "/tmp/${name}.log"
          }
          ls -lh Browser/dist
          test -x Browser/dist/Sreon.AppImage
          head -c 8 Browser/dist/Sreon.AppImage | od -c | head -1
          rm -rf squashfs-root
          Browser/dist/Sreon.AppImage --appimage-extract >/dev/null 2>&1 || echo "::notice::could not self-extract (FUSE-free check skipped)"
          if [ -d squashfs-root ]; then
            ls squashfs-root
            test -x squashfs-root/AppRun
            test -f squashfs-root/usr/bin/Sreon/Sreon
            test -f squashfs-root/usr/bin/Sreon/_internal/VERSION || echo "VERSION missing from the bundle"
            timeout 30 env QT_QPA_PLATFORM=offscreen ./squashfs-root/AppRun >/tmp/launch.log 2>&1 &
            pid=$!; sleep 22
            if kill -0 "$pid" 2>/dev/null; then echo "AppImage payload still running - launched"; kill "$pid"; else wait "$pid" || echo "exited with $?"; fi
            tail -20 /tmp/launch.log || true
          fi
          sudo apt-get install -y "./Browser/dist/sreon_${SREON_VERSION}_amd64.deb"
          which sreon || ls -l /opt/sreon
          dpkg -L sreon | head -20
          test -f /usr/share/applications/sreon.desktop
          grep -q "Exec=/opt/sreon/Sreon" /usr/share/applications/sreon.desktop
          sudo apt-get remove -y sreon
      - name: Freeze log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.pack }}
          path: |
            Browser/freeze.log
            /tmp/launch.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Collect the double-click files
        # always(): a failed post-build check must not destroy the installers themselves -
        # they are what the release job republishes, and red stays red either way.
        if: always() && !cancelled()
        # shell is explicit because the body is bash: the default shell on a Windows runner is
        # pwsh, `case/esac` is not PowerShell, and the step failed at parse time - which is how a
        # perfectly good SreonSetup.exe ended up never being uploaded from the Windows job.
        shell: bash
        run: |
          mkdir -p out
          case "${{ matrix.pack }}" in
            macos)
              cp Browser/dist/Sreon.dmg out/
              cp Browser/dist/Sreon.pkg out/
              ;;
            windows) cp Browser/dist/SreonSetup.exe out/ ;;
            linux)
              cp Browser/dist/Sreon.AppImage out/
              cp Browser/dist/sreon_${SREON_VERSION}_amd64.deb out/
              ;;
          esac
          ls -lh out
      - name: Upload ${{ matrix.name }} installers
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: sreon-${{ matrix.pack }}
          path: out
          if-no-files-found: error
          retention-days: 30

  # -------------------------------------------------------------------- package
  package:
    name: Bundle the double-click files
    needs: [test, build]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: incoming
      - name: Assemble Sreon-<version>-double-click.zip
        run: |
          set -e
          version="$(tr -d '[:space:]' < Browser/VERSION)"
          echo "version=$version" >> "$GITHUB_ENV"
          mkdir -p stage bundle
          # Artifact folders are not spelled the same by every version of download-artifact, so
          # the files are found by name anywhere under incoming/ rather than by a guessed path.
          grab () {
            file="$1"; pack="$2"
            found="$(find incoming -type f -name "$file" -path "*$pack*" | head -1)"
            if [ -z "$found" ]; then
              found="$(find incoming -type f -name "$file" | head -1)"
            fi
            if [ -n "$found" ]; then
              cp "$found" "stage/$file"
              chmod 0755 "stage/$file"
              echo "staged $file ($(du -h "stage/$file" | cut -f1))"
            else
              echo "::error::$file is missing from the $pack artifact"
              find incoming -type f | sed 's/^/  found: /' || true
              exit 1
            fi
          }
          grab Sreon.dmg macos
          grab SreonSetup.exe windows
          grab Sreon.AppImage linux
          # Same script the release workflow uses, so the zip in CI and the zip on the release
          # cannot drift apart: exactly these three files, +x preserved, verified after writing.
          python3 Browser/tools/make_double_click_zip.py --stage stage --sums bundle/SHA256SUMS.txt \
            --out "bundle/Sreon-$version-double-click.zip"
          cp If-it-says-unverified.txt bundle/If-it-says-unverified.txt
          ls -lh bundle

      - uses: actions/upload-artifact@v4
        with:
          name: Sreon-${{ env.version }}-double-click
          path: bundle
          if-no-files-found: error
          retention-days: 30
      - name: Publish a GitHub release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          tag="sreon-v$version"
          notes="Sreon $version - installers for the desktop browser.

          - macOS (Apple silicon): Sreon.dmg - drag Sreon onto Applications. Sreon.pkg does the same for you.
          - Windows: SreonSetup.exe - branded installer, adds Sreon to the Start Menu.
          - Linux: Sreon.AppImage - double-click, no install step.

          Unsigned build, so macOS shows the one-time 'cannot be opened' warning and Windows
          SmartScreen shows 'app isn't commonly signed'. Open the guide in this release, or the
          card printed on the DMG, for the two-click fix. Set the signing secrets in
          .github/workflows/browser.yml and these warnings disappear for good."
          gh release delete "$tag" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$tag" --target "$GITHUB_SHA" --title "Sreon $version" --notes "$notes" || true
          gh release upload "$tag" bundle/* --clobber
          gh release view "$tag" --json assets --jq '.assets[] | "\(.name) \(.size)"'
