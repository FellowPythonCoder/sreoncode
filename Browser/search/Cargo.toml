[package]
name = "sreon-search"
version = "0.5.1"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"

[lib]
name = "sreon_core"

[[bin]]
name = "sreon-api"
path = "src/main.rs"

[dependencies]
scraper = "0.24"
roxmltree = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "macros"] }
url = "2"

[profile.release]
opt-level = 3
